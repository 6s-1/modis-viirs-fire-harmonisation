    <path d="M32 74
             C14 74 7 60 10 47
             C13 35 22 29 26 14
             C31 22 34 26 39 29
             C42 22 44 17 45 10
             C52 24 58 33 56 47
             C54 61 48 74 32 74
             Z"/>
  </g>
  <g fill="#fa5a46">
    <circle cx="25" cy="48" r="3.2"/>
    <circle cx="40" cy="48" r="3.2"/>
  </g>
  <path d="M27 58 q5 7 10 0" fill="none" stroke="#fa5a46" stroke-width="4" stroke-linecap="round"/>
</svg>
