<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!-- The dashboard is now the site root. Older links to app.html keep working. -->
    <meta http-equiv="refresh" content="0; url=./index.html" />
    <link rel="canonical" href="./index.html" />
    <title>Ember</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      html, body { background: #05060a; color: #eef0f3; margin: 0; height: 100%;
        font-family: system-ui, sans-serif; display: grid; place-items: center; }
      a { color: #2bb3a3; }
    </style>
    <script>location.replace("./" + location.search + location.hash);</script>
  </head>
  <body>
    <p>Taking you to the dashboard… <a id="go" href="./index.html">Open it now</a>.</p>
    <script>
      var a = document.getElementById("go");
      if (a) a.href = "./" + location.search + location.hash;
    </script>
  </body>
</html>
