<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!-- The About page is now the "i" panel in the dashboard header. Old links still work. -->
    <meta http-equiv="refresh" content="0; url=./app.html" />
    <link rel="canonical" href="./app.html" />
    <title>Ember</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      html, body { background: #05060a; color: #eef0f3; margin: 0; height: 100%;
        font-family: system-ui, sans-serif; display: grid; place-items: center; }
      a { color: #2bb3a3; }
    </style>
    <script>
      // replace(), not assign(), so Back does not land here again and bounce forward.
      // The query and hash carry across, so an older shared link keeps its box and dates;
      // the meta refresh above is only the no-script fallback.
      location.replace("./app.html" + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>Taking you to the dashboard… <a id="go" href="./app.html">Open it now</a>.</p>
    <script>
      var a = document.getElementById("go");
      if (a) a.href = "./app.html" + location.search + location.hash;
    </script>
  </body>
</html>
